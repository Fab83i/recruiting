# --- Deployment du front (nginx + HTML) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: recruiting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: front
          image: ghcr.io/fab83i/recruiting-front:1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
# --- Service du front ---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: recruiting
spec:
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP