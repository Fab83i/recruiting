apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.front.replicas }}
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: front
          image: {{ .Values.front.image }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80