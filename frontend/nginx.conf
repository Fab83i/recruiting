server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes retombent sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers l'API FastAPI — même origine pour le navigateur, donc pas de CORS.
    # "suivi-api" = nom du service backend dans docker-compose (résolu par Docker).
    location /api/ {
        proxy_pass http://suivi-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
